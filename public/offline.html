<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f2" />
    <title>稍等一下 · 鱼蛋的小世界</title>
    <style>
      * { box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; margin: 0; background: #f7f8f2; color: #263d32; }
      main { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }

      h1 { margin: 0 0 14px; font-size: 24px; font-weight: 600; letter-spacing: -.03em; }
      p { margin: 0; line-height: 1.9; color: #727d72; font-size: 14px; }
      a { display: inline-block; margin-top: 28px; padding: 12px 24px; border-radius: 12px; background: #315b46; color: white; font-size: 14px; text-decoration: none; }
      a:focus-visible { outline: 2px solid #6c8c69; outline-offset: 4px; }
      footer { margin-top: 32px; color: #929b89; font-size: 11px; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <div class="icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="m2 2 20 20M8.5 16.5a5 5 0 0 1 7 0M5 12.5a10 10 0 0 1 3-2m4-1a10 10 0 0 1 7 3M2 8a16 16 0 0 1 3-2m4-1a16 16 0 0 1 13 3"/><circle cx="12" cy="20" r=".5" fill="currentColor"/></svg></div>

        <h1>网络休息了一会儿</h1>
        <p>暂时无法连接网络。你可以返回已访问过的页面查看缓存内容，或在网络恢复后重新打开。</p>
        <a href="/">重新打开看板</a>
        <footer>鱼蛋的小世界 · 把爱写进每一天</footer>
      </section>
    </main>
  </body>
</html>
